name: Build Native Installers

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            type: exe
            artifact: "*.exe"
          - os: macos-latest
            type: dmg
            artifact: "*.dmg"
          - os: ubuntu-24.04
            type: deb
            artifact: "*.deb"

    steps:
      - uses: actions/checkout@v7

      - name: Get version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "VERSION=$INPUT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn package -DskipTests

      - name: Package installer (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          jpackage `
            --input target `
            --name "HexStrategyGame" `
            --main-jar hex-strategy-game.jar `
            --main-class com.hexgame.Main `
            --type exe `
            --dest target/dist `
            --app-version ${{ steps.version.outputs.VERSION }} `
            --java-options "-Dfile.encoding=UTF-8" `
            --win-menu `
            --win-dir-chooser

      - name: Package installer (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          jpackage \
            --input target \
            --name "HexStrategyGame" \
            --main-jar hex-strategy-game.jar \
            --main-class com.hexgame.Main \
            --type dmg \
            --dest target/dist \
            --app-version ${{ steps.version.outputs.VERSION }} \
            --java-options "-Dfile.encoding=UTF-8"

      - name: Package installer (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          jpackage \
            --input target \
            --name "HexStrategyGame" \
            --main-jar hex-strategy-game.jar \
            --main-class com.hexgame.Main \
            --type deb \
            --dest target/dist \
            --app-version ${{ steps.version.outputs.VERSION }} \
            --java-options "-Dfile.encoding=UTF-8" \
            --linux-shortcut

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: target/dist/${{ matrix.artifact }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Manual runs have no tag yet; gh creates v<version> at the built commit
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="v$INPUT_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
